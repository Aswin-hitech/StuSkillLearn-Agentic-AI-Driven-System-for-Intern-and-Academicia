name: StuSkillLink CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: sqlite:///./ci-test.db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
      AUTO_CREATE_SCHEMA: "true"
      AUTO_SEED_DEMO: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
      SECURE_COOKIES: "false"
      CORS_ORIGINS: http://testserver
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      PUBLIC_APP_URL: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-integrations.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app tests migrations
      - name: Run backend tests
        run: pytest -q
      - name: Validate Alembic migrations
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic current
          alembic check
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate production Compose
        env:
          PUBLIC_APP_URL: https://stuskill.example.com
          ALLOWED_HOSTS: stuskill.example.com
          DATABASE_URL: postgresql+psycopg://app:ci-only@db.internal/stuskilllink
          REDIS_URL: redis://redis.internal:6379/0
          JWT_SECRET_KEY: ci-production-secret-that-is-long-and-unique-123456789
          SMTP_URL: smtps://mailer:secret@mail.internal:465
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build -t stuskilllink-backend:ci backend
      - name: Build frontend image
        run: docker build -t stuskilllink-frontend:ci frontend
